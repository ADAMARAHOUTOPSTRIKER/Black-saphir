    <radialGradient id="silk" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ece0cb"/>
      <stop offset="55%" stop-color="#ddccb1"/>
      <stop offset="100%" stop-color="#cbb897"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
